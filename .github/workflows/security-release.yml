name: Security patch release

# When a security fix has reached main since the last release, publish a patch
# release through the existing Release workflow:
#
#  1. Mondays (after the weekly maintenance) the "prepare" job looks for merged
#     pull requests labelled "security" that touch shipped code (Cargo files,
#     the Dockerfile, the extension sources) and are not in the last tag yet.
#     If there is one it opens a pull request "Security release vX.Y.Z" that
#     raises the patch version, and turns on auto-merge.
#  2. When CI is green on that merge commit, the "publish" job starts the
#     Release workflow on main. That workflow creates the tag and the builds,
#     so stores and Docker only ever see a real release tag.
#
# Pull requests opened with the default GITHUB_TOKEN do not start CI, so the
# required checks would never report. The pull request is therefore opened with
# the repository secret RELEASE_BOT_TOKEN (a fine-grained token for this
# repository: Contents, Pull requests and Actions with read and write access).
# If anything fails, an issue is opened.

on:
  schedule:
    # Monday 07:00 UTC, after the weekly maintenance run.
    - cron: "0 7 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Open the version bump
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
    steps:
      - name: The token is set
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::Repository secret RELEASE_BOT_TOKEN is not set."; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Find unreleased security fixes
        id: scan
        run: |
          git fetch --tags --force origin
          LAST=$(git describe --tags --abbrev=0 --match 'v*' origin/main)
          echo "Last release tag: $LAST"
          # A bump from an earlier run may be merged without a release (for
          # example when the Release workflow failed): the version in Cargo.toml
          # has no tag yet and the commit that set it is ours. Release that.
          VERSION=$(node scripts/sync-version.mjs --print)
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null \
             && git log -1 --format=%s origin/main -- Cargo.toml | grep -q '^Security release v'; then
            echo "A merged security bump v$VERSION has no release yet."
            echo "action=release" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh pr list --state open --head release/security-patch --json number --jq 'length' | grep -qv '^0$'; then
            echo "A security release pull request is already open."
            echo "action=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FOUND=""
          for pr in $(gh pr list --state merged --base main --label security --limit 100 --json number --jq '.[].number'); do
            INFO=$(gh pr view "$pr" --json mergeCommit,files)
            SHA=$(echo "$INFO" | jq -r '.mergeCommit.oid // empty')
            [ -n "$SHA" ] || continue
            git merge-base --is-ancestor "$SHA" "$LAST" && continue
            git merge-base --is-ancestor "$SHA" origin/main || continue
            if echo "$INFO" | jq -e '[.files[].path | select(test("^(Cargo\\.lock|Cargo\\.toml|crates/|Dockerfile$|extension/src/)"))] | length > 0' >/dev/null; then
              FOUND="$FOUND #$pr"
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "No unreleased security fix in shipped code."
            echo "action=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Unreleased security fixes:$FOUND"
          echo "fixes=$FOUND" >> "$GITHUB_OUTPUT"
          echo "action=bump" >> "$GITHUB_OUTPUT"
      - name: Open the bump pull request
        if: steps.scan.outputs.action == 'bump'
        env:
          FIXES: ${{ steps.scan.outputs.fixes }}
        run: |
          set -euo pipefail
          IFS=. read -r MAJ MIN PAT < <(node scripts/sync-version.mjs --print)
          NEW="$MAJ.$MIN.$((PAT + 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release/security-patch
          node scripts/sync-version.mjs --set "$NEW"
          cargo update --workspace
          node scripts/sync-version.mjs --check
          git add -A
          git commit -m "Security release v$NEW"
          # A leftover branch from a closed bump PR is replaced.
          git push --force origin release/security-patch
          gh label create release --color 0E8A16 2>/dev/null || true
          gh pr create --base main --head release/security-patch \
            --title "Security release v$NEW" \
            --label release \
            --body "Raises the version to $NEW so that the security fixes merged since the last release ($FIXES) are published. When CI is green on main, the Security patch release workflow starts the Release workflow."
          gh pr merge release/security-patch --auto --squash
      - name: Start the release for a bump that has none yet
        if: steps.scan.outputs.action == 'release'
        run: gh workflow run release.yml --ref main

  publish:
    name: Start the release
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && startsWith(github.event.workflow_run.head_commit.message, 'Security release v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the Release workflow on main
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main

  notify:
    name: Report a failure
    needs: [prepare, publish]
    if: always() && (needs.prepare.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open an issue
        run: |
          TITLE="Security patch release workflow failed"
          if [ "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq length)" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label security \
              --body "The Security patch release workflow failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. A common cause is an expired or missing RELEASE_BOT_TOKEN secret. Security fixes on main stay unreleased until this is fixed."
          fi
