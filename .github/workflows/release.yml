name: Release

# Two ways in, same result:
#  - push a tag vX.Y.Z (git tag v0.11.0 && git push origin v0.11.0), or
#  - Actions > Release > Run workflow on main: this creates the tag for you.
# Either way the release page appears on GitHub and the Extension package and
# Docker image workflows build from the tag. Versions 0.x are marked as
# pre-release (beta); the first 1.x release is stable.
#
# Tags made with GITHUB_TOKEN do not start other workflows, but dispatching
# them explicitly is allowed, so the manual route does that; a pushed tag
# starts them by itself.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release page
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The commit must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main. Releases come from merged commits."; exit 1; }
      - name: Read and check the version
        id: v
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          node scripts/sync-version.mjs --check
          VERSION=$(node scripts/sync-version.mjs --print)
          if [ "$REF_TYPE" = "tag" ]; then
            node scripts/sync-version.mjs --tag "$REF_NAME"
            # A pushed tag already exists; the builds start from the push.
            echo "new_tag=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            # The tag is there already (an earlier run, or by hand): only the
            # release page may be missing. Never move or reuse a tag.
            TAGGED=$(git ls-remote origin "refs/tags/v$VERSION^{}" "refs/tags/v$VERSION" | tail -1 | cut -f1)
            if [ "$TAGGED" != "$GITHUB_SHA" ]; then
              echo "::error::Tag v$VERSION already exists on another commit. Raise the version first: node scripts/sync-version.mjs --set X.Y.Z"
              exit 1
            fi
            echo "::notice::Tag v$VERSION already exists on this commit. No builds are started again; re-run a failed build from the Actions page."
            echo "new_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "new_tag=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "pre=$(node scripts/sync-version.mjs --prerelease)" >> "$GITHUB_OUTPUT"
      - name: CI must be green on this commit
        run: |
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --paginate --jq '.check_runs[] | [.name, .conclusion] | @tsv')
          echo "$RUNS"
          for family in "Rust (" "Extension (" "E2E ("; do
            echo "$RUNS" | grep -qF "$family" || { echo "::error::No '$family' check run found for $GITHUB_SHA (CI runs on pushes to main and on pull requests)"; exit 1; }
          done
          if echo "$RUNS" | grep -E "^(Rust|Extension|E2E) \(" | grep -Evq "(success|skipped|neutral)$"; then
            echo "::error::CI is not green on $GITHUB_SHA"; exit 1
          fi
      - name: Create the GitHub release (and the tag, if needed)
        env:
          TAG: ${{ steps.v.outputs.tag }}
          PRE: ${{ steps.v.outputs.pre }}
          NEW_TAG: ${{ steps.v.outputs.new_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists."
            exit 0
          fi
          FLAGS=""
          [ "$PRE" = "true" ] && FLAGS="--prerelease"
          [ "$NEW_TAG" != "true" ] && FLAGS="$FLAGS --verify-tag"
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "bookmoor $TAG" $FLAGS
      - name: Start the builds (manual route, new tag only)
        if: steps.v.outputs.new_tag == 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh workflow run extension-package.yml --ref "$TAG"
          gh workflow run docker.yml --ref "$TAG"
