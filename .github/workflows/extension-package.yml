name: Extension package

# Builds the installable extension when its code changes on main (or by hand):
# a Chrome zip, an unsigned Firefox zip and, if Mozilla credentials are set as
# repository secrets, a signed Firefox .xpi. Download them from the run's
# "Artifacts" section. The Chrome zip goes to the Chrome Web Store for review
# only for a release (a pushed tag vX.Y.Z) or when the run is started by hand with the
# "chrome_store" box ticked, and only if the store secrets are set (see README). Pull requests do not run this: they have no secrets and
# every signing uses up a version number at Mozilla.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "extension/**"
      - "schema/**"
      - ".github/workflows/extension-package.yml"
  # A pushed tag vX.Y.Z is a release build: exact version, signed, and sent to
  # the Chrome Web Store. Releases made in the GitHub UI create such a tag too.
  workflow_dispatch:
    inputs:
      chrome_store:
        description: "Also upload the Chrome build to the Web Store and submit it for review"
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a run midway through signing.
# Release builds get their own group so a dev build can never replace a
# queued release run (a group keeps only one pending run).
concurrency:
  group: extension-package-${{ startsWith(github.ref, 'refs/tags/v') && github.ref || 'dev' }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (Chrome zip, Firefox xpi)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extension
    env:
      # Optional. Create them at https://addons.mozilla.org/developers/addon/api/key/
      # and add them under Settings > Secrets and variables > Actions.
      WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
      # Optional. Chrome Web Store upload, see README "Chrome Web Store".
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      # One release number: [workspace.package] version in Cargo.toml (see
      # scripts/sync-version.mjs). A release must come from the matching tag
      # vX.Y.Z and is built with exactly that version. Other runs (main, manual)
      # are dev builds X.Y.Z.<run number> (browsers accept four-part versions).
      # They sort after X.Y.Z, so they are only signed while X.Y.Z is already
      # released (tag exists); after a version bump and before the release tag
      # they are built but not signed, so the release can still use X.Y.Z.
      - name: Set the version
        id: version
        working-directory: .
        run: |
          BASE=$(node scripts/sync-version.mjs --print)
          RELEASE=false
          case "${{ github.ref }}" in refs/tags/v*) RELEASE=true;; esac
          if [ "$RELEASE" = "true" ]; then
            node scripts/sync-version.mjs --tag "${{ github.ref_name }}"
            VERSION="$BASE"
          else
            VERSION="$BASE.${{ github.run_number }}"
          fi
          node scripts/sync-version.mjs --check
          SIGN=true
          if [ "$RELEASE" != "true" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$BASE" >/dev/null; then
            SIGN=false
            echo "::notice::v$BASE is not released yet, so this dev build is not signed or uploaded (it would outrank the release)."
          fi
          echo "sign=$SIGN" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
            m.version = process.argv[1];
            fs.writeFileSync("extension/manifest.json", JSON.stringify(m, null, 2) + "\n");
          ' "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - name: Chrome zip
        run: |
          mkdir -p ../artifacts
          (cd dist && zip -qr "../../artifacts/bookmoor-chrome-${{ steps.version.outputs.version }}.zip" .)
      - name: Firefox zip (unsigned)
        run: |
          npm run package:firefox
          cp web-ext-artifacts/*.zip ../artifacts/
      - name: Sign the Firefox add-on
        if: steps.version.outputs.sign == 'true' && env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        run: |
          npm run sign:firefox
          cp web-ext-artifacts/*.xpi ../artifacts/
      - name: Say why there is no signed file
        if: steps.version.outputs.sign == 'true' && (env.WEB_EXT_API_KEY == '' || env.WEB_EXT_API_SECRET == '')
        run: echo "::notice::No Firefox .xpi was signed because the secrets WEB_EXT_API_KEY and WEB_EXT_API_SECRET are not set."
      - name: Upload to the Chrome Web Store
        if: steps.version.outputs.sign == 'true' && (steps.version.outputs.release == 'true' || inputs.chrome_store) && env.CWS_EXTENSION_ID != '' && env.CWS_CLIENT_ID != '' && env.CWS_CLIENT_SECRET != '' && env.CWS_REFRESH_TOKEN != ''
        run: |
          set -euo pipefail
          ZIP="../artifacts/bookmoor-chrome-${{ steps.version.outputs.version }}.zip"
          TOKEN=$(curl -fsS https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token | jq -er .access_token)
          echo "::add-mask::$TOKEN"
          UP=$(curl -fsS -X PUT -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" \
            -T "$ZIP" "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID")
          echo "$UP" | jq -c '{uploadState, itemError}'
          [ "$(echo "$UP" | jq -r .uploadState)" = "SUCCESS" ] || { echo "::error::Chrome Web Store upload failed"; exit 1; }
          PUB=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID/publish")
          echo "$PUB" | jq -c '{status, statusDetail}'
          echo "$PUB" | jq -e '.status | index("OK") or index("ITEM_PENDING_REVIEW")' >/dev/null \
            || { echo "::error::Chrome Web Store did not accept the submission"; exit 1; }
      - name: Say why nothing went to the Chrome Web Store
        if: (steps.version.outputs.release == 'true' || inputs.chrome_store) && (env.CWS_EXTENSION_ID == '' || env.CWS_CLIENT_ID == '' || env.CWS_CLIENT_SECRET == '' || env.CWS_REFRESH_TOKEN == '')
        run: echo "::notice::Nothing was uploaded to the Chrome Web Store because one of CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN is not set."
      - uses: actions/upload-artifact@v4
        with:
          name: bookmoor-extension-${{ steps.version.outputs.version }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90
