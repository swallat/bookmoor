name: Extension package

# Builds the installable extension when its code changes on main (or by hand):
# a Chrome zip and an unsigned Firefox zip. A release run (a pushed tag vX.Y.Z)
# also signs a Firefox .xpi if Mozilla credentials are set as repository
# secrets. Download them from the run's "Artifacts" section. Nothing is signed at Mozilla or sent to the Chrome Web
# Store except for a release (a pushed tag vX.Y.Z), and only if the secrets are
# set (see docs/development.md). Builds from main and manual runs only produce
# unsigned artifacts. Pull requests do not run this: they have no secrets and
# every signing uses up a version number at Mozilla.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "extension/**"
      - "schema/**"
      - ".github/workflows/extension-package.yml"
  # A pushed tag vX.Y.Z is a release build: exact version, signed, and sent to
  # the Chrome Web Store. Releases made in the GitHub UI create such a tag too.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run midway through signing.
# Release builds get their own group so a dev build can never replace a
# queued release run (a group keeps only one pending run).
concurrency:
  group: extension-package-${{ startsWith(github.ref, 'refs/tags/v') && github.ref || (github.event_name == 'workflow_dispatch' && github.run_id) || 'dev' }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (Chrome zip, Firefox zip/xpi)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extension
    env:
      # Optional. Create them at https://addons.mozilla.org/developers/addon/api/key/
      # and add them under Settings > Secrets and variables > Actions.
      WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
      # Optional. Chrome Web Store upload, see docs/development.md "Chrome Web Store".
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      # Optional. Private RSA key (PEM) for "Verified CRX uploads" in the Web
      # Store. Once the item is opted in, the store only takes CRX files signed
      # with it. Set this secret before you opt in.
      CWS_CRX_PRIVATE_KEY: ${{ secrets.CWS_CRX_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag must be on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main. Releases come from merged commits."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      # One release number: [workspace.package] version in Cargo.toml (see
      # scripts/sync-version.mjs). A release must come from the matching tag
      # vX.Y.Z and is built with exactly that version. Other runs (main, manual)
      # are dev builds X.Y.Z.<run number> (browsers accept four-part versions).
      # They are never signed or uploaded to a store: only a release is.
      - name: Set the version
        id: version
        working-directory: .
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          BASE=$(node scripts/sync-version.mjs --print)
          RELEASE=false
          case "$REF" in refs/tags/v*) RELEASE=true;; esac
          if [ "$RELEASE" = "true" ]; then
            node scripts/sync-version.mjs --tag "$REF_NAME"
            VERSION="$BASE"
          else
            VERSION="$BASE.${{ github.run_number }}"
          fi
          node scripts/sync-version.mjs --check
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
            m.version = process.argv[1];
            fs.writeFileSync("extension/manifest.json", JSON.stringify(m, null, 2) + "\n");
          ' "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - name: Chrome zip
        run: |
          mkdir -p ../artifacts
          (cd dist && zip -qr "../../artifacts/bookmoor-chrome-${{ steps.version.outputs.version }}.zip" .)
      # Release only: a CRX3 signed with your own key, for the Web Store's
      # "Verified CRX uploads". Without the secret the plain zip is uploaded.
      - name: Chrome CRX (signed with your key)
        if: steps.version.outputs.release == 'true' && env.CWS_CRX_PRIVATE_KEY != ''
        working-directory: .
        run: |
          set -euo pipefail
          KEY=$(mktemp)
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$CWS_CRX_PRIVATE_KEY" > "$KEY"
          node scripts/pack-crx.mjs "artifacts/bookmoor-chrome-${{ steps.version.outputs.version }}.zip" "$KEY" "artifacts/bookmoor-chrome-${{ steps.version.outputs.version }}.crx"
      - name: Firefox zip (unsigned)
        run: |
          npm run package:firefox
          cp web-ext-artifacts/*.zip ../artifacts/
      - name: Sign the Firefox add-on
        if: steps.version.outputs.release == 'true' && env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        run: |
          npm run sign:firefox
          cp web-ext-artifacts/*.xpi ../artifacts/
      - name: Say why there is no signed file
        if: steps.version.outputs.release == 'true' && (env.WEB_EXT_API_KEY == '' || env.WEB_EXT_API_SECRET == '')
        run: echo "::notice::No Firefox .xpi was signed because the secrets WEB_EXT_API_KEY and WEB_EXT_API_SECRET are not set."
      # Keep the files before the store upload, so a store problem never loses a
      # signed build (a version can be signed only once at Mozilla).
      - uses: actions/upload-artifact@v4
        with:
          name: bookmoor-extension-${{ steps.version.outputs.version }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90
      - name: Upload to the Chrome Web Store
        if: steps.version.outputs.release == 'true' && env.CWS_EXTENSION_ID != '' && env.CWS_CLIENT_ID != '' && env.CWS_CLIENT_SECRET != '' && env.CWS_REFRESH_TOKEN != ''
        run: |
          set -euo pipefail
          ZIP="../artifacts/bookmoor-chrome-${{ steps.version.outputs.version }}.zip"
          EXTRA=()
          if [ -n "$CWS_CRX_PRIVATE_KEY" ]; then
            # Verified CRX uploads: the signed CRX goes up as a raw upload.
            ZIP="../artifacts/bookmoor-chrome-${{ steps.version.outputs.version }}.crx"
            EXTRA=(-H "X-Goog-Upload-Protocol: raw" -H "X-Goog-Upload-File-Name: $(basename "$ZIP")")
          fi
          TOKEN=$(curl -fsS https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token | jq -er .access_token)
          echo "::add-mask::$TOKEN"
          UP=$(curl -fsS -X PUT -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" "${EXTRA[@]}" \
            -T "$ZIP" "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID")
          echo "$UP" | jq -c '{uploadState, itemError}'
          if [ "$(echo "$UP" | jq -r .uploadState)" != "SUCCESS" ]; then
            if echo "$UP" | jq -e '.itemError[]? | select(.error_code == "ITEM_NOT_UPDATABLE")' >/dev/null; then
              # The item is still in review (or ready to publish): the store takes
              # no new upload until that is done. Not a build failure.
              echo "::warning::The Chrome Web Store item cannot be updated now (pending review or ready to publish). Upload the bookmoor-chrome-${{ steps.version.outputs.version }} file (.crx if you use verified uploads, otherwise .zip) from this run's artifacts once the review is finished."
              exit 0
            fi
            echo "::error::Chrome Web Store upload failed"; exit 1
          fi
          PUB=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID/publish")
          echo "$PUB" | jq -c '{status, statusDetail}'
          echo "$PUB" | jq -e '.status | index("OK") or index("ITEM_PENDING_REVIEW")' >/dev/null \
            || { echo "::error::Chrome Web Store did not accept the submission"; exit 1; }
      - name: Say why nothing went to the Chrome Web Store
        if: steps.version.outputs.release == 'true' && (env.CWS_EXTENSION_ID == '' || env.CWS_CLIENT_ID == '' || env.CWS_CLIENT_SECRET == '' || env.CWS_REFRESH_TOKEN == '')
        run: echo "::notice::Nothing was uploaded to the Chrome Web Store because one of CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN is not set."
