<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>bookmoor settings</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 16px; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 6px; }
    .row { display: flex; gap: 8px; margin-top: 6px; }
    button { margin-top: 1rem; padding: 6px 12px; }
    #status { margin-top: 1rem; }
    #sync.bad { color: #b00020; font-weight: 600; }
  </style>
</head>
<body>
  <h1>bookmoor</h1>
  <label for="url">Server URL</label>
  <input id="url" type="url" placeholder="https://bookmoor.example.com" />
  <label for="token">API token</label>
  <input id="token" name="bookmoor-api-token" type="password" autocomplete="new-password" spellcheck="false" data-lpignore="true" data-1p-ignore />
  <div id="tokeninfo"></div>
  <label>Extra headers (e.g. reverse-proxy header auth)</label>
  <div id="headers"></div>
  <button id="add" type="button">Add header</button>
  <label>Extra query parameters (e.g. a share-link token)</label>
  <div id="query"></div>
  <button id="addq" type="button">Add parameter</button>
  <div><button id="save" type="button">Save</button> <button id="syncnow" type="button">Sync now</button></div>
  <div id="status" role="status"></div>
  <h2>Sync status</h2>
  <div id="sync" role="status"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
