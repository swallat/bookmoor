<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>bookmoor</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { width: 300px; padding: 14px; }
    .brand img { width: 28px; height: 28px; border-radius: 6px; }
    .brand h1 { font-size: 16px; }
    #syncnow, #signin { margin-top: 14px; width: 100%; }
    #sync { margin: 12px 0; word-break: break-word; }
    .foot { font-size: 13px; }
  </style>
</head>
<body>
  <header class="brand"><img src="icons/logo.svg" alt="" /><h1>bookmoor</h1></header>
  <button id="syncnow" class="primary" type="button">Sync now</button>
  <div id="sync" role="status"></div>
  <button id="signin" type="button" hidden>Sign in</button>
  <div class="foot"><a id="settings" href="#">Settings</a></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
