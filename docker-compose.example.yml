# Copy to docker-compose.yml. Put a reverse proxy with TLS in front of port 8787:
# the server speaks plain HTTP inside the container.
services:
  bookmoor:
    image: ghcr.io/swallat/bookmoor:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # Optional: fix the first admin token (bkm_<id>_<64 hex characters>).
      # BOOKMOOR_ADMIN_TOKEN: ""
      # Optional: write the Dynacat page for one user and profile.
      # One output per line: file=PATH[;profile=NAME][;folder=A/B/C]
      BOOKMOOR_DYNACAT_OUTPUTS: |
        file=/dynacat/bookmoor.yml;profile=Work
        file=/dynacat/private.yml;profile=Private;folder=Bar/Dev
      # Single output instead: BOOKMOOR_DYNACAT_FILE, with
      # BOOKMOOR_DYNACAT_USER and BOOKMOOR_DYNACAT_PROFILE.
    volumes:
      - bookmoor-data:/data      # state.json
      - ./dynacat:/dynacat       # must be writable by uid 10001
volumes:
  bookmoor-data:
