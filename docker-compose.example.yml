# Copy to docker-compose.yml. Put a reverse proxy with TLS in front of port 8787:
# the server speaks plain HTTP inside the container.
services:
  bookmoor:
    image: ghcr.io/swallat/bookmoor:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # Optional: fix the first admin token (bkm_<id>_<64 hex characters>).
      # BOOKMOOR_ADMIN_TOKEN: ""
      # Require the proxy's client-certificate verdict (README, "Client certificates"):
      # BOOKMOOR_CLIENT_CERT_HEADER: X-SSL-Client-Verify
      # Dynacat outputs made in the web UI (admin tab "Dynacat"): the directory
      # Dynacat reads. Needs `mkdir dynacat && chown 10001 dynacat` first.
      # BOOKMOOR_DYNACAT_DIR: /dynacat
      # Optional: fixed outputs from the command line instead (read-only in the web UI).
      # One output per line: file=PATH[;profile=NAME][;folder=A/B/C]. Enable
      # only after `mkdir dynacat && chown 10001 dynacat`: the server exits
      # at startup if it cannot write the file.
      # BOOKMOOR_DYNACAT_OUTPUTS: |
      #   file=/dynacat/bookmoor.yml;profile=Work
      #   file=/dynacat/private.yml;profile=Private;folder=Bar/Dev
      # One Dynacat page with a widget for every output, so dynacat.yml needs a
      # single `- $include:` (see docs/adapters/dynacat.md):
      # BOOKMOOR_DYNACAT_PAGE: file=/dynacat/bookmoor-page.yml;name=Bookmoor;columns=2
      # Single output instead: BOOKMOOR_DYNACAT_FILE, with
      # BOOKMOOR_DYNACAT_USER and BOOKMOOR_DYNACAT_PROFILE.
    volumes:
      - bookmoor-data:/data      # state.json
      - ./dynacat:/dynacat       # must be writable by uid 10001
volumes:
  bookmoor-data:
